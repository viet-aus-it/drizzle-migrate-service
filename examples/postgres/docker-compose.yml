services:
  db:
    image: postgres:17-alpine
    restart: on-failure
    env_file: ".env"
    container_name: test_db
    ports:
      - 5432:5432

  db-deploy:
    image: ghcr.io/viet-aus-it/drizzle-migrate-service
    depends_on:
      - db
    env_file: ".env"
    container_name: test_db_deploy_pg
    volumes:
      - ./drizzle:/src/drizzle
      - ./drizzle.config.ts:/src/drizzle.config.ts
